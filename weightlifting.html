<html lang="en">
<head>

<body>

  <p><a href="index.html">&larr; Back to home</a></p>

  <h1>Weightlifting</h1>

  <!-- lead:start -->
  <p class="lead">I started weightlifting in high school, though I don&#x27;t lift as much these days, just enough to maintain what I&#x27;ve built. My all-time PRs are a 260 bench, a 400 deadlift, and a 365 squat. Now I focus more on bodyweight training instead.</p>
  <!-- lead:end -->

  <!--
    Photos and videos: drop files into images/weightlifting/, add a line for each to
    images/weightlifting/captions.txt (filename | caption), and write this page's
    description in images/weightlifting/description.txt. Then run  python3 gallery.py
    Everything shows in one grid at the bottom. The script rewrites only the text
    between the start/end markers, so edit freely around them.
  -->
  <!-- gallery:start -->
  <div class="carousel">
    <figure class="carousel-slide">
      <img src="images/weightlifting/2F49F464-C95E-4401-B8A2-65BAB7D6A27F_1_105_c.jpeg" alt="Midnight back double bicep pose">
      <figcaption>Midnight back double bicep pose</figcaption>
    </figure>
    <figure class="carousel-slide" hidden>
      <img src="images/weightlifting/IMG_2863.jpeg" alt="Planking with friends">
      <figcaption>Planking with friends</figcaption>
    </figure>
    <figure class="carousel-slide" hidden>
      <video src="images/weightlifting/IMG_3077.mp4" controls></video>
      <figcaption>Deadlifting on a BOSU ball</figcaption>
    </figure>
    <figure class="carousel-slide" hidden>
      <video src="images/weightlifting/IMG_3193.mp4" controls></video>
      <figcaption>Throwing weight around</figcaption>
    </figure>
    <figure class="carousel-slide" hidden>
      <img src="images/weightlifting/IMG_5085.jpeg" alt="Lifting underwater with friends">
      <figcaption>Lifting underwater with friends</figcaption>
    </figure>
    <button type="button" class="carousel-prev" aria-label="Previous">&larr;</button>
    <button type="button" class="carousel-next" aria-label="Next">&rarr;</button>
    <p class="carousel-counter">1 / 5</p>
  </div>
  <!-- gallery:end -->

  <script src="carousel.js"></script>
</body>
</html>
