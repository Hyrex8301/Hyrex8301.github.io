<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Change this to your name or whatever you want the browser tab to say. -->
  <title>My hobbies</title>
  <link rel="stylesheet" href="style.css">

<body class="home">

  <h1>My hobbies</h1>

  <p>
    A short intro goes here: who you are and why these are the things you spend
    your free time on. Replace this paragraph with your own words.
  </p>

  <!--
    Each link goes to its own page. To add a hobby later, copy one of the hobby
    pages, then add another <li> here with its own thumb:<slug>:start/end markers.
    Thumbnails: drop photos into images/<slug>/ and run  python3 gallery.py
    It sets each thumbnail below to that hobby's hero image, rewriting only the
    text between the markers.
  -->
  <ul class="hobby-list">
    <li>
      <a href="climbing.html">
        <!-- thumb:climbing:start -->
        <!-- No photo yet. Add one to images/climbing/ and run python3 gallery.py -->
        <!-- thumb:climbing:end -->
        <span>Climbing</span>
      </a>
    </li>
    <li>
      <a href="parkour.html">
        <!-- thumb:parkour:start -->
        <!-- No photo yet. Add one to images/parkour/ and run python3 gallery.py -->
        <!-- thumb:parkour:end -->
        <span>Parkour</span>
      </a>
    </li>
    <li>
      <a href="video-games.html">
        <!-- thumb:video-games:start -->
        <!-- No photo yet. Add one to images/video-games/ and run python3 gallery.py -->
        <!-- thumb:video-games:end -->
        <span>Video games</span>
      </a>
    </li>
    <li>
      <a href="tennis.html">
        <!-- thumb:tennis:start -->
        <!-- No photo yet. Add one to images/tennis/ and run python3 gallery.py -->
        <!-- thumb:tennis:end -->
        <span>Tennis</span>
      </a>
    </li>
  </ul>

</body>
</html>
